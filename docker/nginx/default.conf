# Edge proxy. Sets X-Forwarded-For so the API's per-IP rate limits see real
# clients (Next's rewrite proxy forwards this header to the API unchanged).
# Terminate TLS here (or at a managed load balancer) in production.
server {
  listen 80;
  server_name _;
  client_max_body_size 2m;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location / {
    proxy_pass http://web:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
