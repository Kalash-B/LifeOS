<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Offline · LifeOS</title>
<style>
  :root { color-scheme: light dark; --bg: #f7f3ec; --text: #2b231c; --muted: #6f6356; --accent: #b84a1c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #171411; --text: #f3ede5; --muted: #c4b9ac; --accent: #e8743f; } }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; text-align: center; padding: 16px; }
  img { width: 72px; height: 72px; }
  h1 { font-size: 20px; margin: 16px 0 6px; }
  p { color: var(--muted); margin: 0 0 20px; }
  button { font: inherit; padding: 10px 18px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer; }
</style>
</head>
<body>
  <main>
    <img src="/logo-mark.png" alt="" />
    <h1>You're offline</h1>
    <p>LifeOS needs a connection to load your data. You're still signed in.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
